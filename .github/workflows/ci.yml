name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lightweight Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib scipy scikit-learn biopython h5py tqdm country_converter seaborn umap-learn openpyxl statsmodels transformers performer-pytorch
      - name: Smoke tests
        run: |
          python -m compileall -q classifier cdhit dataset msa paths.py
          python -m msa.run --help
          python -m classifier.workflow.reports.run_reports --help
